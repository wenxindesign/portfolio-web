<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: #0B0E1A;
  font-family: -apple-system, sans-serif;
}

/* Deep gradient background matching Opus dark theme */
.bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 90% 80% at 50% 40%, rgba(15,18,40,1) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 75% 60%, rgba(100,50,200,0.06) 0%, transparent 50%),
    radial-gradient(ellipse 40% 50% at 25% 70%, rgba(60,30,140,0.05) 0%, transparent 50%);
}

/* Subtle purple ambient glow */
.glow-1 {
  position: absolute;
  left: 15%; top: 20%;
  width: 600px; height: 500px;
  background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 60%);
  filter: blur(80px);
}

.glow-2 {
  position: absolute;
  right: 10%; bottom: 15%;
  width: 500px; height: 400px;
  background: radial-gradient(circle, rgba(139,92,246,0.06) 0%, transparent 60%);
  filter: blur(70px);
}

.glow-3 {
  position: absolute;
  left: 50%; top: 55%;
  transform: translateX(-50%);
  width: 800px; height: 300px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.12) 0%, transparent 60%);
  filter: blur(60px);
}

/* ─── Glassmorphism cubes ─── */
.glass-cube {
  position: absolute;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06);
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.05);
}

.cube-1 {
  width: 180px; height: 180px;
  left: 60px; top: 120px;
  transform: rotate(-12deg);
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(139,92,246,0.08) 0%, rgba(255,255,255,0.02) 100%);
  border-color: rgba(139,92,246,0.1);
}

.cube-2 {
  width: 120px; height: 120px;
  right: 80px; top: 180px;
  transform: rotate(8deg);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(139,92,246,0.03) 100%);
}

.cube-3 {
  width: 220px; height: 160px;
  left: 100px; bottom: 80px;
  transform: rotate(6deg);
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(139,92,246,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border-color: rgba(139,92,246,0.08);
}

.cube-4 {
  width: 140px; height: 140px;
  right: 120px; bottom: 120px;
  transform: rotate(-6deg);
  border-radius: 16px;
}

.cube-5 {
  width: 90px; height: 90px;
  left: 280px; top: 60px;
  transform: rotate(15deg);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(139,92,246,0.1) 0%, rgba(255,255,255,0.02) 100%);
  border-color: rgba(139,92,246,0.12);
}

.cube-6 {
  width: 100px; height: 100px;
  right: 300px; top: 80px;
  transform: rotate(-18deg);
  border-radius: 14px;
}

.cube-7 {
  width: 160px; height: 120px;
  right: 50px; bottom: 300px;
  transform: rotate(10deg);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(139,92,246,0.05) 0%, rgba(255,255,255,0.02) 100%);
}

.cube-8 {
  width: 70px; height: 70px;
  left: 50px; top: 450px;
  transform: rotate(-20deg);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(139,92,246,0.12) 0%, rgba(255,255,255,0.03) 100%);
  border-color: rgba(139,92,246,0.15);
}

/* ─── Laptop ─── */
.laptop-wrapper {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -48%);
  z-index: 10;
}

.laptop-screen {
  width: 1100px;
  height: 688px;
  background: #0D0D11;
  border-radius: 12px 12px 0 0;
  overflow: hidden;
  border: 2px solid #2a2a35;
  border-bottom: none;
  box-shadow:
    0 -2px 30px rgba(139,92,246,0.08),
    0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}

.laptop-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* Camera notch */
.laptop-screen::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 22px;
  background: #1a1a22;
  border-radius: 0 0 10px 10px;
  z-index: 2;
}

.laptop-screen::after {
  content: '';
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 6px;
  background: #2a2a35;
  border-radius: 50%;
  z-index: 3;
}

.laptop-base {
  width: 1240px;
  height: 14px;
  background: linear-gradient(to bottom, #3a3a45, #2a2a35);
  border-radius: 0 0 4px 4px;
  margin: 0 auto;
  position: relative;
  left: -70px;
}

.laptop-base::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 260px; height: 4px;
  background: #444;
  border-radius: 0 0 4px 4px;
}

/* Bottom hinge line */
.laptop-hinge {
  width: 1100px;
  height: 3px;
  background: linear-gradient(to right, transparent, #3a3a48, #3a3a48, transparent);
  margin: 0 auto;
}

/* Reflection on screen */
.screen-reflect {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(165deg, rgba(255,255,255,0.03) 0%, transparent 40%);
  pointer-events: none;
  z-index: 1;
}

/* Subtle noise texture */
.noise {
  position: absolute; inset: 0;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px;
  pointer-events: none;
  z-index: 100;
}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <!-- Glassmorphism cubes -->
  <div class="glass-cube cube-1"></div>
  <div class="glass-cube cube-2"></div>
  <div class="glass-cube cube-3"></div>
  <div class="glass-cube cube-4"></div>
  <div class="glass-cube cube-5"></div>
  <div class="glass-cube cube-6"></div>
  <div class="glass-cube cube-7"></div>
  <div class="glass-cube cube-8"></div>

  <!-- Laptop -->
  <div class="laptop-wrapper">
    <div class="laptop-screen">
      <img src="/hifi_v2_command-center.jpeg" alt="OpusClip Command Center">
      <div class="screen-reflect"></div>
    </div>
    <div class="laptop-hinge"></div>
    <div class="laptop-base"></div>
  </div>

  <div class="noise"></div>
</body>
</html>
