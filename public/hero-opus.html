<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 3200px;
  height: 1080px;
  overflow: hidden;
  background: #0D1025;
  font-family: -apple-system, sans-serif;
}

/* Smooth unified background - single large gradient to avoid seam lines */
.bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 120% 100% at 50% 45%, #151838 0%, #0D1025 100%);
}

/* Soft purple ambient glows - large and blurry for smooth blending */
.glow-1 {
  position: absolute;
  left: 5%; top: 10%;
  width: 900px; height: 700px;
  background: radial-gradient(circle, rgba(139,92,246,0.10) 0%, transparent 65%);
  filter: blur(120px);
}

.glow-2 {
  position: absolute;
  right: 0; bottom: 5%;
  width: 800px; height: 600px;
  background: radial-gradient(circle, rgba(100,60,200,0.08) 0%, transparent 65%);
  filter: blur(120px);
}

.glow-3 {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 1200px; height: 500px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.10) 0%, transparent 65%);
  filter: blur(100px);
}

/* ─── Translucent gradient glass blocks ─── */
/* Mix of flat planes and 3D angled cubes, scattered across canvas */

.glass-cube {
  position: absolute;
  border-radius: 18px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(160,130,255,0.28);
  background: linear-gradient(135deg, rgba(139,92,246,0.22) 0%, rgba(80,50,200,0.06) 50%, rgba(200,170,255,0.14) 100%);
  box-shadow:
    0 8px 40px rgba(139,92,246,0.12),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(139,92,246,0.08),
    0 0 24px rgba(139,92,246,0.08);
}

/* ── FLAT PLANES (simple rotate, no perspective) ── */

/* Far left, large flat */
.cube-1 {
  width: 160px; height: 160px;
  left: 80px; top: 180px;
  transform: rotate(-8deg);
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(160,120,255,0.30) 0%, rgba(100,60,220,0.08) 40%, rgba(180,150,255,0.18) 100%);
  border-color: rgba(160,130,255,0.32);
}

/* Far left bottom, medium flat */
.cube-3 {
  width: 120px; height: 90px;
  left: 200px; bottom: 120px;
  transform: rotate(5deg);
  border-radius: 16px;
  background: linear-gradient(140deg, rgba(150,110,255,0.26) 0%, rgba(90,55,210,0.08) 45%, rgba(170,140,255,0.18) 100%);
  border-color: rgba(160,130,255,0.28);
}

/* Small flat, left upper area */
.cube-5 {
  width: 75px; height: 75px;
  left: 420px; top: 90px;
  transform: rotate(12deg);
  border-radius: 14px;
  background: linear-gradient(125deg, rgba(180,150,255,0.32) 0%, rgba(130,90,240,0.10) 45%, rgba(200,170,255,0.22) 100%);
  border-color: rgba(180,150,255,0.34);
}

/* Small flat, far right top */
.cube-6 {
  width: 80px; height: 80px;
  right: 180px; top: 140px;
  transform: rotate(-14deg);
  border-radius: 14px;
  background: linear-gradient(155deg, rgba(165,135,255,0.28) 0%, rgba(115,75,235,0.10) 50%, rgba(185,155,255,0.20) 100%);
  border-color: rgba(165,135,255,0.30);
}

/* Far right bottom, flat rectangle */
.cube-10 {
  width: 130px; height: 95px;
  right: 120px; bottom: 160px;
  transform: rotate(7deg);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(175,145,255,0.28) 0%, rgba(115,75,235,0.10) 50%, rgba(195,165,255,0.20) 100%);
  border-color: rgba(175,145,255,0.30);
}

/* Tiny flat, left mid */
.cube-8 {
  width: 55px; height: 55px;
  left: 60px; top: 520px;
  transform: rotate(-22deg);
  border-radius: 10px;
  background: linear-gradient(120deg, rgba(185,155,255,0.35) 0%, rgba(140,100,245,0.12) 50%, rgba(200,175,255,0.24) 100%);
  border-color: rgba(185,155,255,0.36);
}

/* ── 3D ANGLED CUBES (with perspective transforms) ── */

/* 3D cube - left area */
.cube-2 {
  width: 140px; height: 140px;
  left: 340px; bottom: 200px;
  transform: perspective(600px) rotateY(25deg) rotateX(-10deg);
  border-radius: 18px;
  background: linear-gradient(130deg, rgba(180,150,255,0.32) 0%, rgba(120,80,240,0.10) 50%, rgba(160,130,255,0.22) 100%);
  border-color: rgba(170,140,255,0.34);
  box-shadow:
    0 12px 50px rgba(139,92,246,0.18),
    inset 0 2px 0 rgba(255,255,255,0.16),
    inset 0 -2px 8px rgba(139,92,246,0.10),
    0 0 35px rgba(139,92,246,0.10);
}

/* 3D cube - right side, tilted back */
.cube-4 {
  width: 150px; height: 120px;
  right: 280px; bottom: 100px;
  transform: perspective(500px) rotateY(-20deg) rotateX(12deg);
  border-radius: 18px;
  background: linear-gradient(150deg, rgba(170,140,255,0.30) 0%, rgba(110,70,230,0.10) 50%, rgba(190,160,255,0.20) 100%);
  border-color: rgba(170,140,255,0.32);
  box-shadow:
    0 10px 45px rgba(139,92,246,0.16),
    inset 0 2px 0 rgba(255,255,255,0.15),
    inset 0 -2px 8px rgba(139,92,246,0.10),
    0 0 30px rgba(139,92,246,0.10);
}

/* 3D cube - far right, large, angled */
.cube-7 {
  width: 170px; height: 130px;
  right: 50px; top: 240px;
  transform: perspective(550px) rotateY(-30deg) rotateX(8deg);
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(155,120,255,0.28) 0%, rgba(100,60,220,0.08) 45%, rgba(175,145,255,0.20) 100%);
  border-color: rgba(160,130,255,0.30);
  box-shadow:
    0 12px 48px rgba(139,92,246,0.16),
    inset 0 2px 0 rgba(255,255,255,0.14),
    inset 0 -2px 8px rgba(139,92,246,0.10),
    0 0 32px rgba(139,92,246,0.10);
}

/* 3D cube - left top, tilted forward */
.cube-9 {
  width: 110px; height: 110px;
  left: 130px; top: 50px;
  transform: perspective(500px) rotateY(18deg) rotateX(15deg);
  border-radius: 16px;
  background: linear-gradient(140deg, rgba(165,135,255,0.30) 0%, rgba(105,65,225,0.10) 45%, rgba(185,155,255,0.22) 100%);
  border-color: rgba(165,135,255,0.32);
  box-shadow:
    0 10px 42px rgba(139,92,246,0.16),
    inset 0 2px 0 rgba(255,255,255,0.16),
    inset 0 -2px 6px rgba(139,92,246,0.10),
    0 0 28px rgba(139,92,246,0.10);
}

/* 3D cube - far right upper, strongly angled */
.cube-11 {
  width: 180px; height: 140px;
  right: 60px; top: 60px;
  transform: perspective(450px) rotateY(-25deg) rotateX(-8deg);
  border-radius: 20px;
  background: linear-gradient(145deg, rgba(155,120,255,0.26) 0%, rgba(95,55,215,0.08) 45%, rgba(175,145,255,0.18) 100%);
  border-color: rgba(160,130,255,0.28);
  box-shadow:
    0 10px 45px rgba(139,92,246,0.14),
    inset 0 2px 0 rgba(255,255,255,0.14),
    inset 0 -2px 8px rgba(139,92,246,0.08),
    0 0 30px rgba(139,92,246,0.08);
}

/* 3D cube - small, right mid-bottom, steep angle */
.cube-12 {
  width: 90px; height: 90px;
  right: 380px; top: 80px;
  transform: perspective(400px) rotateY(22deg) rotateX(-14deg);
  border-radius: 14px;
  background: linear-gradient(130deg, rgba(180,150,255,0.32) 0%, rgba(130,90,240,0.12) 50%, rgba(200,170,255,0.22) 100%);
  border-color: rgba(180,150,255,0.34);
  box-shadow:
    0 8px 38px rgba(139,92,246,0.18),
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -1px 5px rgba(139,92,246,0.10),
    0 0 26px rgba(139,92,246,0.10);
}

/* ─── Laptop ─── */
.laptop-wrapper {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -46%);
  z-index: 10;
}

.laptop-screen {
  width: 1440px;
  height: 900px;
  background: #0D0D11;
  border-radius: 12px 12px 0 0;
  overflow: hidden;
  border: 2px solid #2a2a35;
  border-bottom: none;
  box-shadow:
    0 -2px 30px rgba(139,92,246,0.08),
    0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}

.laptop-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}

/* Camera notch */
.laptop-screen::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 22px;
  background: #1a1a22;
  border-radius: 0 0 10px 10px;
  z-index: 2;
}

.laptop-screen::after {
  content: '';
  position: absolute;
  top: 6px; left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 6px;
  background: #2a2a35;
  border-radius: 50%;
  z-index: 3;
}

.laptop-base {
  width: 1580px;
  height: 14px;
  background: linear-gradient(to bottom, #3a3a45, #2a2a35);
  border-radius: 0 0 4px 4px;
  margin: 0 auto;
  position: relative;
  left: -70px;
}

.laptop-base::before {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 260px; height: 4px;
  background: #444;
  border-radius: 0 0 4px 4px;
}

/* Bottom hinge line */
.laptop-hinge {
  width: 1440px;
  height: 3px;
  background: linear-gradient(to right, transparent, #3a3a48, #3a3a48, transparent);
  margin: 0 auto;
}

/* Reflection on screen */
.screen-reflect {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(165deg, rgba(255,255,255,0.03) 0%, transparent 40%);
  pointer-events: none;
  z-index: 1;
}

/* Subtle noise texture */
.noise {
  position: absolute; inset: 0;
  opacity: 0.015;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px;
  pointer-events: none;
  z-index: 100;
}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <!-- Glassmorphism cubes -->
  <div class="glass-cube cube-1"></div>
  <div class="glass-cube cube-2"></div>
  <div class="glass-cube cube-3"></div>
  <div class="glass-cube cube-4"></div>
  <div class="glass-cube cube-5"></div>
  <div class="glass-cube cube-6"></div>
  <div class="glass-cube cube-7"></div>
  <div class="glass-cube cube-8"></div>
  <div class="glass-cube cube-9"></div>
  <div class="glass-cube cube-10"></div>
  <div class="glass-cube cube-11"></div>
  <div class="glass-cube cube-12"></div>

  <!-- Laptop -->
  <div class="laptop-wrapper">
    <div class="laptop-screen">
      <img src="./hifi_v2_command-center.jpeg" alt="OpusClip Command Center">
      <div class="screen-reflect"></div>
    </div>
    <div class="laptop-hinge"></div>
    <div class="laptop-base"></div>
  </div>

  <div class="noise"></div>
</body>
</html>
